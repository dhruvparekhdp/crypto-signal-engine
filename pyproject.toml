[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-signal-engine"
version = "0.1.0"
description = "Real-time crypto market analysis: five signal detectors, a confluence gate, and a paper-trading simulator"
requires-python = ">=3.11"
dependencies = [
    "httpx[asyncio,http2]>=0.27",
    "h2>=4.0",
    "aiohttp>=3.9",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "apscheduler>=3.10",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "alembic>=1.13",
    "python-telegram-bot>=21.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
