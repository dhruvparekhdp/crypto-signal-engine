<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lab Monitor</title>
<style>
:root{--bg:#0f141a;--card:#18202a;--fg:#e8edf3;--mut:#8ea0b3;--line:#263241;--ok:#4cc38a;--warn:#e8b04b;--bad:#ef6f6c;--acc:#5bb6e8}
@media (prefers-color-scheme:light){:root{--bg:#f3f5f8;--card:#fff;--fg:#17202b;--mut:#5b6776;--line:#dde1e7;--ok:#1f7a4d;--warn:#a86a00;--bad:#b4332d;--acc:#0b6fa8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;padding:14px 16px 40px}
h1{font-size:18px;margin:0 0 2px}h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:20px 0 8px}
.sub{color:var(--mut);font-size:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;min-width:0}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px}.running{background:#1d3a52;color:var(--acc)}.done{background:#173a2b;color:var(--ok)}.failed,.stalled\?,.waitingforworkers{background:#40201f;color:var(--bad)}
.bar{height:7px;background:var(--line);border-radius:5px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.k{color:var(--mut);font-size:11px}.v{font-size:20px;font-weight:700}
pre{margin:6px 0 0;padding:8px;background:var(--bg);border-radius:6px;overflow-x:auto;font-size:11px;color:var(--mut);max-height:150px}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:4px 6px;text-align:left;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:600}td.n{text-align:right;font-variant-numeric:tabular-nums}
.pos{color:var(--ok)}.neg{color:var(--bad)}.wrap{overflow-x:auto}
</style></head><body>
<h1>Lab Monitor</h1><div class="sub" id="upd">loading…</div>
<div id="banner"></div>
<h2>Machines</h2><div id="mach"></div>
<h2>1 · Without AI: what the rules alone did</h2><div id="noai"></div>
<h2>2 · With AI vs without (local models, outcomes hidden from the model)</h2><div id="gate"></div>
<h2>AI review queue (explaining finished trades)</h2><div id="ai"></div>
<h2>Test runs</h2><div id="tests"></div>
<h2>Backtest jobs</h2><div id="jobs"></div>
<h2>Best results so far</h2><div id="res"></div>
<script>
const fmt=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}h ${m}m`:`${m}m ${s%60}s`};
const esc=t=>String(t??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function mach(m){const warn=(m.temp_c>85)||(m.ac===false&&m.battery_pct<25);
return `<div class="card"><div class="row"><b>${esc(m.name)}</b><span class="sub">${m.age_s!=null?'updated '+m.age_s+'s ago':'this server'}</span></div>
<div class="grid"><div><div class="k">CPU</div><div class="v">${m.cpu_pct??'–'}%</div></div><div><div class="k">RAM</div><div class="v">${m.ram_used_gb}/${m.ram_total_gb}G</div></div>
<div><div class="k">Temp</div><div class="v ${m.temp_c>85?'neg':''}">${m.temp_c??'–'}°C</div></div>
<div><div class="k">Power</div><div class="v ${warn?'neg':''}">${m.ac===undefined?'–':(m.ac?'plugged':'battery')} ${m.battery_pct!=null?m.battery_pct+'%':''}</div></div></div></div>`}
const _open=new Set(),_ledgers={};
function wdetail(rows){if(!rows||!rows.length)return '';
return `<div class="card"><div class="k">Full wallet history, live 4h + 8h book: every monthly start, expand a start for its trade-by-trade ledger</div>${rows.map(r=>{const id=`wd-${r.months}-${r.i}`;
return `<details id="${id}" ${_open.has(id)?'open':''} ontoggle="_tog(this)"><summary><b>${esc(r.label)}</b> · ${r.months} months · ${r.n} starts · <span class="pos">${r.hit} hit 100</span> · <span class="neg">${r.bust} bust</span> · median end ${num(r.median_end,1)}</summary>
<div class="wrap"><table><tr><th>start</th><th>result</th><th>end</th><th>peak</th><th>trades</th><th>days</th><th>worst DD</th></tr>${r.starts.map(x=>{const lid=`${id}-${x.start}`;
return `<tr><td colspan="7" style="padding:0"><details id="${lid}" ${_open.has(lid)?'open':''} ontoggle="_tog(this,${r.months},${r.i},'${x.start}')"><summary style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:4px 6px;font-size:12px"><span>${x.start}</span><span class="${x.status==='TARGET'?'pos':x.status==='BUST'?'neg':''}">${x.status==='TARGET'?'hit 100':x.status==='BUST'?'bust':'still going'}</span><span>${num(x.end,1)}</span><span>${num(x.peak,1)}</span><span>${x.trades}</span><span>${Math.round(x.days)}</span><span>${Math.round(x.dd*100)}%</span></summary><div class="ledger" id="L-${lid}">${_ledgers[lid]||'<div class="sub">loading…</div>'}</div></details></td></tr>`}).join('')}</table></div></details>`}).join('')}</div>`}
async function _tog(el,m,i,start){if(el.open)_open.add(el.id);else _open.delete(el.id);
 if(el.open&&m!==undefined&&!_ledgers[el.id]){try{const L=await (await fetch(`/api/wallet_ledger?months=${m}&i=${i}&start=${start}`)).json();
 _ledgers[el.id]=L.length?`<table><tr><th>closed</th><th>coin</th><th>side</th><th>strategy</th><th>exit</th><th>size</th><th>P&amp;L</th><th>balance</th></tr>${L.map(t=>`<tr><td>${esc(t.t)}</td><td>${esc((t.symbol||'').replace('USDT',''))}</td><td>${esc(t.side)}</td><td>${esc(t.strategy)}</td><td>${esc(t.exit)}</td><td class="n">${num(t.notional,1)}</td><td class="n ${cls(t.pnl)}">${num(t.pnl,2)}</td><td class="n">${num(t.balance,2)}</td></tr>`).join('')}</table>`:'<div class="sub">no trades</div>';
 const box=document.getElementById('L-'+el.id); if(box)box.innerHTML=_ledgers[el.id];}catch(e){}}}
function noai(n){if(!n)return '';const w=n.wallet||{},b=n.breakdown||{};
const tbl=(rows,title)=>!rows||!rows.length?'':`<div class="card"><div class="k">${title}</div><div class="wrap"><table><tr>${rows[0].map(c=>`<th>${esc(c||'')}</th>`).join('')}</tr>${rows.slice(1).map(r=>`<tr>${r.map((c,i)=>`<td class="${i?'n '+(typeof c==='number'&&/R_per|20|0\./.test('x')?'':''):''}">${typeof c==='number'?c:esc(c)}</td>`).join('')}</tr>`).join('')}</table></div></div>`;
const wal=Object.entries(w).map(([k,rows])=>`<div class="card"><div class="k">25 USDT wallet started at the first of every month, followed for ${k} (the four 4h strategies together, no AI). "hit 100" is the share of start dates that reached 100 USDT.</div><div class="wrap"><table><tr><th>risk</th><th>open at once</th><th>pause after 3 losses</th><th>hit 100</th><th>bust</th><th>still going</th><th>median end</th><th>worst DD</th></tr>${rows.map(r=>`<tr><td class="n">${Math.round(r.risk*100)}%</td><td class="n">${r.concurrent}</td><td class="n">${r.loss_streak_pause?'yes':'no'}</td><td class="n ${r.hit_100>0?'pos':''}">${Math.round(r.hit_100*100)}%</td><td class="n ${r.bust>0?'neg':''}">${Math.round(r.bust*100)}%</td><td class="n">${Math.round(r.still_running*100)}%</td><td class="n ${r.median_end_balance>25?'pos':'neg'}">${num(r.median_end_balance,1)}</td><td class="n">${Math.round(r.worst_dd_pct)}%</td></tr>`).join('')}</table></div></div>`).join('');
return `${tfs(n.timeframes)}${wdetail(n.wallet_detail)}${wal}${tbl(b.strategy_by_year,'R per trade by strategy and year (negative in red would mean a losing year)')}${tbl(b.by_symbol,'by coin')}${tbl(b.by_side,'longs vs shorts')}${tbl(b.by_strategy,'by strategy')}`}
function banner(b){if(!b)return '';const icon=s=>({done:'✔',running:'●',paused:'❚❚',waiting:'○',failed:'✖'}[s]||'•');const col=s=>({done:'pos',running:'',paused:'warn',failed:'neg'}[s]||'');
return `<div class="card"><div class="row"><b>${esc(b.title||'Status')}</b><span class="sub">updated ${esc(b.updated||'')}</span></div>${(b.items||[]).map(i=>`<div class="row" style="padding:5px 0;border-top:1px solid var(--line)"><span><b class="${col(i.state)}">${icon(i.state)} ${esc(i.label)}</b><div class="sub">${esc(i.detail||'')}</div></span><span class="pill ${i.state==='done'?'done':i.state==='running'?'running':'stalled?'}">${esc(i.state)}</span></div>`).join('')}</div>`}
function tfs(rows){if(!rows||!rows.length)return '';return `<div class="card"><div class="k">Rules-only results by timeframe, every run (all strategies and settings together). Longer bars = costs shrink against the stop = the edge appears.</div><div class="wrap"><table><tr><th>bars</th><th>trades</th><th>settings tested</th><th>positive</th><th>clearly significant*</th><th>gross R</th><th>cost R</th><th>net R</th><th>passed walk-forward**</th></tr>${rows.map(r=>`<tr><td>${esc(r.tf)}</td><td class="n">${(r.trades/1000).toFixed(0)}k</td><td class="n">${r.configs}</td><td class="n ${r.positive/r.configs>.5?'pos':''}">${r.positive}</td><td class="n ${r.bonf_sig?'pos':''}">${r.bonf_sig}</td><td class="n">${num(r.mean_gross,3)}</td><td class="n">${num(r.cost_r,3)}</td><td class="n ${cls(r.mean_net)}"><b>${num(r.mean_net,3)}</b></td><td class="n ${r.wf_positive_strategies?'pos':''}">${r.wf_positive_strategies}/${r.wf_strategies}</td></tr>`).join('')}</table></div><div class="sub">* still significant after correcting for how many settings were tried · ** strategies whose settings, chosen on 12 months, still made money on the next 3 unseen months</div></div>`}
function pct(x){return x==null?'–':Math.round(x*100)+'%'}
function num(x,d=2){return x==null?'–':(+x).toFixed(d)}
function cls(x){return x==null?'':(x>0?'pos':'neg')}
function gate(a){const pctDone=a.total?Math.round(100*a.done/a.total):0;
const rate=a.rate_per_hour?a.rate_per_hour/3600:(a.done&&a.elapsed_s?a.done/a.elapsed_s:0),eta=rate?(a.total-a.done)/rate:0;
const cmps=Object.entries(a.compare||{}).map(([m,c])=>{if(!c.n||c.n<4)return `<div class="card"><b>${esc(m)}</b><div class="sub">collecting… ${c.n||0} decisions so far</div></div>`;
const verdict=c.take_exp_r==null?'':(c.take_exp_r>c.all_exp_r?`<span class="pos">AI is ahead by ${num(c.lift_r_per_trade)} R per trade</span>`:`<span class="neg">AI is behind by ${num(-c.lift_r_per_trade)} R per trade</span>`);
return `<div class="card"><div class="row"><b>${esc(m)}</b><span class="sub">${c.n} trades judged · AI takes ${pct(c.take_rate)}</span></div>
<div class="wrap"><table><tr><th></th><th>trades</th><th>R/trade</th><th>win</th><th>PF</th><th>total R</th></tr>
<tr><td>Without AI (take all)</td><td class="n">${c.n}</td><td class="n ${cls(c.all_exp_r)}">${num(c.all_exp_r)}</td><td class="n">${pct(c.all_win)}</td><td class="n">${num(c.all_pf)}</td><td class="n ${cls(c.all_total_r)}">${num(c.all_total_r,1)}</td></tr>
<tr><td><b>With AI (taken)</b></td><td class="n">${c.take_n??'–'}</td><td class="n ${cls(c.take_exp_r)}"><b>${num(c.take_exp_r)}</b></td><td class="n">${pct(c.take_win)}</td><td class="n">${num(c.take_pf)}</td><td class="n ${cls(c.take_total_r)}">${num(c.take_total_r,1)}</td></tr>
<tr><td>AI skipped</td><td class="n">${c.skip_n??'–'}</td><td class="n ${cls(c.skip_exp_r)}">${num(c.skip_exp_r)}</td><td class="n">${pct(c.skip_win)}</td><td class="n">–</td><td class="n">–</td></tr></table></div>
<div class="sub" style="margin-top:6px">${verdict}${c.take_total_r!=null?` · risking 1% of the wallet per trade, the same ${c.n} trades return <b>${num(c.all_total_r,1)}%</b> without AI vs <b>${num(c.take_total_r,1)}%</b> with AI (simple sum, no compounding)`:''}</div>
<div class="sub">score vs result: Spearman ${num(c.spearman_score_vs_r)} · AUC ${num(c.auc)} (0.5 = coin flip) · taken minus skipped: ${c.take_minus_skip_ci?`95% range ${num(c.take_minus_skip_ci[0])} to ${num(c.take_minus_skip_ci[1])} R${c.take_minus_skip_ci[0]>0?' <span class="pos">(AI adds value)</span>':c.take_minus_skip_ci[1]<0?' <span class="neg">(AI hurts)</span>':' (not distinguishable from luck yet)'}`:'–'}</div></div>`}).join('');
const bl=a.baseline?(()=>{const f=a.baseline.same_trades_as_the_ai_saw||{},g=a.baseline.population_walk_forward||{};return `<div class="card"><div class="k">benchmark: a plain non-AI filter (ridge regression, walk-forward) on the same entry facts</div>
<div class="sub">same trades the AI saw (${f.n||0}): takes ${pct(f.take_rate)} · R/trade ${num(f.take_exp_r)} taken vs ${num(f.all_exp_r)} all (lift ${num(f.lift_r_per_trade)}) · on all ${g.n||0} later trades: lift ${num(g.lift_r_per_trade)} R per trade. If the AI cannot beat this, it is not worth its hours.</div></div>`})():'';
const ws=(a.workers||[]).length?`<div class="card"><div class="k">laptops working on this</div><div class="wrap"><table><tr><th>laptop</th><th>done</th><th>avg s</th><th>last result</th><th>failed</th></tr>${a.workers.map(w=>`<tr><td>${esc(w.name)}</td><td class="n">${w.done}</td><td class="n">${Math.round(w.avg_s)}</td><td class="n">${fmt(w.ago_s)} ago</td><td class="n ${w.failed?'neg':''}">${w.failed}</td></tr>`).join('')}</table></div></div>`:'';
const bs=Object.entries(a.by_strategy||{}).map(([m,o])=>`<div class="card"><div class="k">${esc(m)} by strategy (R/trade: all → AI-taken)</div><div class="wrap"><table>${Object.entries(o).map(([s,v])=>`<tr><td>${esc(s)}</td><td class="n">${v.n}</td><td class="n ${cls(v.all_exp_r)}">${num(v.all_exp_r)}</td><td class="n">→</td><td class="n ${cls(v.take_exp_r)}">${num(v.take_exp_r)} (${v.take_n??0} taken)</td></tr>`).join('')}</table></div></div>`).join('');
return `<div class="card"><div class="row"><b>${esc(a.title)}</b><span class="pill ${(a.state||'').replace(/ /g,'')}">${esc(a.state)}</span></div>
<div class="sub">${esc(a.model)}${a.think?' · thinking on':''} · ${a.done}/${a.total} decisions${a.failed?` (${a.failed} failed)`:''} · reference: all ${a.population_n} trades of these strategies average ${num(a.population_exp_r)} R (${pct(a.population_win)} win) · sample ${a.sample_n} per model</div>
<div class="bar"><i style="width:${pctDone}%"></i></div><div class="sub">${pctDone}% · elapsed ${fmt(a.elapsed_s||0)}${eta?' · about '+fmt(eta)+' left':''} · avg ${a.avg_s?a.avg_s.toFixed(0)+'s':'–'} per decision${a.rate_per_hour?` · ${a.rate_per_hour.toFixed(1)} decisions/hour overall`:''}</div></div>${ws}${cmps}${bl}${bs}
<div class="card"><div class="k">latest decisions</div><div class="wrap"><table><tr><th>coin</th><th>AI</th><th>score</th><th>real R</th><th>why</th></tr>${(a.recent||[]).slice().reverse().map(r=>`<tr><td>${esc((r.symbol||'').replace('USDT',''))}</td><td>${esc(r.decision||(r.ok===false?'failed':''))}</td><td class="n">${r.score??''}</td><td class="n ${cls(r.r_net)}">${num(r.r_net)}</td><td class="k">${esc((r.reason||'').slice(0,90))}</td></tr>`).join('')}</table></div></div>`}
function ai(a){const pct=a.total?Math.round(100*a.done/a.total):0;
const rate=a.done&&a.elapsed_s?a.done/a.elapsed_s:0,eta=rate?(a.total-a.done)/rate:0;
return `<div class="card"><div class="row"><b>${esc(a.title||a.name)}</b><span class="pill ${a.state}">${esc(a.state)}</span></div>
<div class="sub">stage ${esc(a.stage)} · ${a.done}/${a.total} reviews · ${esc(a.model)}${a.think?' (thinking)':''}</div>
<div class="bar"><i style="width:${pct}%"></i></div><div class="sub">${pct}% · elapsed ${fmt(a.elapsed_s||0)}${eta?' · about '+fmt(eta)+' left on this stage':''} · avg ${a.avg_s?a.avg_s.toFixed(0)+'s':'–'} per review</div>
<div class="wrap"><table><tr><th>model</th><th>strategy</th><th>cause</th><th>q</th><th>s</th></tr>${(a.recent||[]).slice().reverse().map(r=>`<tr><td>${esc((r.model||'').split(':')[0])}</td><td>${esc(r.strategy)}</td><td class="${r.consistent===true?'pos':r.consistent===false?'neg':''}">${esc(r.cause)}</td><td class="n">${r.signal_quality??''}</td><td class="n">${r.wall_s?Math.round(r.wall_s):''}</td></tr>`).join('')}</table></div></div>`}
function testrun(j){const pc=j.pct??(j.state==='done'?100:0);const ok=j.failed===0&&j.state==='done';
return `<div class="card"><div class="row"><b>${esc(j.name)}</b><span class="pill ${j.state==='done'?(ok?'done':'failed'):j.state}">${esc(j.state==='done'?(ok?'all passed':'failures'):j.state)}</span></div>
<div class="sub">${esc(j.host)} · ${fmt(j.elapsed_s)}${j.passed!=null?` · <span class="pos">${j.passed} passed</span>`:''}${j.failed?` · <span class="neg">${j.failed} failed</span>`:''}</div>
<div class="bar"><i style="width:${pc}%"></i></div><div class="sub">${pc}%</div>
${(j.failures||[]).length?`<pre>${esc(j.failures.join('\n'))}</pre>`:''}</div>`}
function job(j){const n=j.symbols_done;return `<div class="card"><div class="row"><b>${esc(j.name)}</b><span class="pill ${j.state}">${esc(j.state)}</span></div>
<div class="sub">${esc(j.host)} · elapsed ${fmt(j.elapsed_s)}${n?` · ${n}/12 symbols done`:''}</div>${n?`<div class="bar"><i style="width:${Math.min(100,n/12*100)}%"></i></div>`:''}
<pre>${esc(j.tail.join('\n'))}</pre></div>`}
function res(r){const cols=['strategy','params','exit','n','win_rate','expectancy_r','ci_lo','profit_factor','max_dd_r','null_p'];const nl=r.top[0]&&'null_p' in r.top[0];
const row=x=>`<tr><td>${esc(x.strategy)}<div class="k">${esc((x.params||'').slice(0,26))} ${esc((x.exit||'').slice(0,22))}</div></td><td class="n">${x.n}</td><td class="n">${Math.round(x.win_rate*100)}%</td><td class="n ${x.expectancy_r>0?'pos':'neg'}">${x.expectancy_r}</td><td class="n">${x.ci_lo??''}</td><td class="n">${x.profit_factor}</td><td class="n">${x.max_dd_r??''}</td>${nl?`<td class="n">${x.null_p??''}</td>`:''}</tr>`;
const head=`<tr><th>strategy</th><th>n</th><th>win</th><th>R/trade</th><th>CI lo</th><th>PF</th><th>max DD (R)</th>${nl?'<th>null p</th>':''}</tr>`;
return `<div class="card"><div class="row"><b>${esc(r.run)}</b><span class="sub">${r.positive}/${r.configs} configs positive</span></div><div class="wrap"><table>${head}${r.top.slice(0,6).map(row).join('')}</table></div>
${r.top.length>6?`<details><summary class="sub">all ${r.top.length} shown</summary><div class="wrap"><table>${head}${r.top.slice(6).map(row).join('')}</table></div></details>`:''}</div>`}
async function tick(){let s;try{s=await (await fetch('/api/state',{cache:'no-store'})).json();}catch(e){document.getElementById('upd').textContent='cannot reach the server · retrying';return}
try{
document.getElementById('upd').textContent='live · '+new Date().toLocaleTimeString()+' · refreshes every 6s';
document.getElementById('mach').innerHTML=s.machines.map(mach).join('');
const G=s.ai.filter(x=>x.kind==='gate'),Q=s.ai.filter(x=>x.kind!=='gate');
document.getElementById('gate').innerHTML=G.length?G.map(gate).join(''):'<div class="card sub">AI gate experiment not started yet</div>';
document.getElementById('ai').innerHTML=Q.length?Q.map(ai).join(''):'<div class="card sub">no review queue running</div>';
const T=s.jobs.filter(j=>j.kind==='tests'),B=s.jobs.filter(j=>j.kind!=='tests');
document.getElementById('tests').innerHTML=T.length?T.map(testrun).join(''):'<div class="card sub">no test runs yet</div>';
document.getElementById('jobs').innerHTML=B.length?B.map(job).join(''):'<div class="card sub">no jobs</div>';
document.getElementById('banner').innerHTML=banner(s.banner);
document.getElementById('noai').innerHTML=noai(s.noai)||'<div class="card sub">no rules-only findings yet</div>';
document.getElementById('res').innerHTML=s.results.length?s.results.map(res).join(''):'<div class="card sub">no finished runs yet</div>';}
catch(e){document.getElementById('upd').textContent='display error: '+e.message}}
tick();setInterval(tick,6000);
</script></body></html>
